<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeDrift - Autonomous API Breaking-Change & Dependency Degradation Guard</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- Top Enterprise Header -->
  <header class="header-bar">
    <div class="brand-section">
      <a href="#" class="brand-logo" id="brand-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span>CODEDRIFT</span>
      </a>
      <span class="badge badge-neutral" style="font-size: 10px; font-weight: 600;">ENTERPRISE GUARD</span>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active" id="nav-btn-landing" data-target="view-landing">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Overview
      </button>

      <button class="nav-btn" id="nav-btn-dashboard" data-target="view-dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        Live Dashboard
      </button>

      <button class="nav-btn" id="nav-btn-architecture" data-target="view-architecture">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/>
          <polyline points="2 12 12 17 22 12"/>
        </svg>
        Architecture Spec
      </button>
    </nav>

    <div class="system-status">
      <span class="status-dot"></span>
      <span id="gateway-status-label">AST Engine: Ready (v1.0.0)</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-wrapper">

    <!-- VIEW 1: Technical Landing Page -->
    <section id="view-landing" class="section-view active-view">
      <div id="landing-container">
        <!-- Rendered dynamically by landing.js -->
      </div>
    </section>

    <!-- VIEW 2: Interactive Operational Dashboard -->
    <section id="view-dashboard" class="section-view">
      <div id="dashboard-container">
        <!-- Rendered dynamically by dashboard.js -->
      </div>
    </section>

    <!-- VIEW 3: Architecture Spec -->
    <section id="view-architecture" class="section-view">
      <div id="architecture-container">
        <!-- Static enterprise architecture specification -->
      </div>
    </section>

  </main>

  <!-- Subsystem Scripts -->
  <script src="/static/landing.js"></script>
  <script src="/static/diff_view.js"></script>
  <script src="/static/reachability_view.js"></script>
  <script src="/static/remediation_view.js"></script>
  <script src="/static/dashboard.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
